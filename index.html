<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Belajar</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --text:#1f2430; --muted:#6b7280;
    --primary:#4f46e5; --primary-soft:#eef0ff; --border:#e5e7eb; --danger:#dc2626; --ok:#16a34a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12141b; --card:#1b1e28; --text:#eceef4; --muted:#9aa1b2;
      --primary:#818cf8; --primary-soft:#262a45; --border:#2c3040; --danger:#f87171; --ok:#4ade80; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
  .tab{flex:1 0 auto;padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);
    border-radius:999px;cursor:pointer;font-size:.9rem}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.today::after{content:" •";color:var(--ok)}
  .tab.active.today::after{color:#fff}
  .add{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:18px}
  .add h2{font-size:1rem;margin:0 0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button{font:inherit;color:var(--text)}
  input,select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-width:0}
  input:focus,select:focus{outline:2px solid var(--primary);border-color:transparent}
  .grow{flex:1 1 160px}
  .btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
  .btn:hover{opacity:.9}
  .item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .time{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:2px 9px;font-size:.82rem;font-weight:600}
  .subject{font-weight:600;font-size:1.08rem;margin-top:6px}
  .icon{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:6px}
  .icon:hover{color:var(--danger);background:var(--bg)}
  .notes{list-style:none;margin:12px 0 0;padding:0}
  .note{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--border)}
  .note input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);flex:none}
  .note span{flex:1;word-break:break-word}
  .note.done span{text-decoration:line-through;color:var(--muted)}
  .addnote{display:flex;gap:8px;margin-top:10px}
  .addnote input{flex:1}
  .addnote button{background:var(--primary-soft);color:var(--primary);border:0;border-radius:10px;padding:0 14px;cursor:pointer;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--border);border-radius:14px}
  .foot{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Jadwal Belajar</h1>
  <p class="sub">Atur jadwal pelajaran dan catat tugas di tiap pelajaran.</p>

  <div class="tabs" id="tabs"></div>

  <form class="add" id="addForm">
    <h2>Tambah pelajaran</h2>
    <div class="row">
      <input class="grow" id="subject" placeholder="Nama pelajaran (mis. Matematika)" required maxlength="60">
      <select id="day"></select>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="time" id="start" value="07:00" required>
      <input type="time" id="end" value="08:30" required>
      <button class="btn" type="submit">Tambah</button>
    </div>
  </form>

  <div id="list"></div>

  <div class="foot">
    <button class="link" id="exportBtn">Ekspor data</button>
    <button class="link" id="importBtn">Impor data</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</div>

<script>
const DAYS = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const KEY = "jadwal-belajar-v1";
const todayIdx = (new Date().getDay() + 6) % 7;
let activeDay = todayIdx;

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){}
}
let items = load();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function el(tag, props = {}, ...kids){
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k,v]) => {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k in n) n[k] = v;
    else n.setAttribute(k, v);
  });
  kids.flat().forEach(c => n.append(c));
  return n;
}

const daySel = document.getElementById("day");
DAYS.forEach((d,i) => daySel.append(el("option",{value:i,textContent:d})));

function renderTabs(){
  const t = document.getElementById("tabs");
  t.replaceChildren(...DAYS.map((d,i) =>
    el("button",{
      class:"tab" + (i===activeDay?" active":"") + (i===todayIdx?" today":""),
      textContent:d,
      onclick:()=>{ activeDay=i; daySel.value=i; render(); }
    })));
}

function renderList(){
  const list = document.getElementById("list");
  const todays = items.filter(x => x.day === activeDay).sort((a,b) => a.start.localeCompare(b.start));
  if (!todays.length){
    list.replaceChildren(el("div",{class:"empty",textContent:"Belum ada pelajaran di hari " + DAYS[activeDay] + "."}));
    return;
  }
  list.replaceChildren(...todays.map(item => {
    const input = el("input",{placeholder:"Tambah catatan / tugas…",maxLength:200});
    const addNote = () => {
      const v = input.value.trim();
      if (!v) return;
      item.notes.push({id:uid(), text:v, done:false});
      save(); render();
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); addNote(); } });

    return el("div",{class:"item"},
      el("div",{class:"head"},
        el("div",{},
          el("span",{class:"time",textContent:item.start + " – " + item.end}),
          el("div",{class:"subject",textContent:item.subject})),
        el("button",{class:"icon",title:"Hapus pelajaran",textContent:"🗑",onclick:()=>{
          if (confirm("Hapus “" + item.subject + "” beserta catatannya?")){
            items = items.filter(x => x.id !== item.id); save(); render();
          }
        }})),
      el("ul",{class:"notes"}, item.notes.map(n =>
        el("li",{class:"note" + (n.done?" done":"")},
          el("input",{type:"checkbox",checked:n.done,onchange:e=>{ n.done=e.target.checked; save(); render(); }}),
          el("span",{textContent:n.text}),
          el("button",{class:"icon",title:"Hapus catatan",textContent:"✕",onclick:()=>{
            item.notes = item.notes.filter(x => x.id !== n.id); save(); render();
          }})))),
      el("div",{class:"addnote"}, input, el("button",{type:"button",textContent:"Tambah",onclick:addNote}))
    );
  }));
}

function render(){ renderTabs(); renderList(); }

document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const subject = document.getElementById("subject").value.trim();
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;
  if (!subject) return;
  if (end <= start){ alert("Jam selesai harus setelah jam mulai."); return; }
  const day = Number(daySel.value);
  items.push({id:uid(), day, subject, start, end, notes:[]});
  save();
  activeDay = day;
  document.getElementById("subject").value = "";
  render();
});

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
  const a = el("a",{href:URL.createObjectURL(blob),download:"jadwal-belajar.json"});
  a.click(); URL.revokeObjectURL(a.href);
};
const importFile = document.getElementById("importFile");
document.getElementById("importBtn").onclick = () => importFile.click();
importFile.onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const data = JSON.parse(t);
      if (!Array.isArray(data)) throw 0;
      items = data; save(); render();
    } catch(_){ alert("File tidak valid."); }
  });
  importFile.value = "";
};

daySel.value = activeDay;
render();
</script>
</body>
</html>
